<!doctype html>
<html lang="en" data-bs-theme="dark" class="sn-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>StillNote</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="ambient-orb ambient-orb-one" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-two" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-three" aria-hidden="true"></div>
  <div class="app-shell" aria-busy="true">
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <aside class="sidebar">
      <div class="sidebar-top d-flex align-items-center justify-content-between">
        <a class="brand text-decoration-none" href="#">
          <span class="brand-mark" aria-hidden="true">
            <img src="{{ url_for('static', filename='icon.svg') }}" alt="">
          </span>
          <span>StillNote</span>
        </a>
        <button class="btn icon-button d-lg-none" id="closeSidebar" aria-label="Close navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <nav class="nav nav-pills flex-column px-2 gap-1" aria-label="Notes navigation">
        <button class="nav-link active text-start" data-view="notes">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 16h6"/></svg></span>
          All notes
        </button>
        <button class="nav-link text-start" data-view="pinned">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-.75 6 3.25 3v2h-11v-2l3.25-3z"/><path d="M12 14v7"/></svg></span>
          Pinned
        </button>
        <button class="nav-link text-start" data-view="archived">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM5.5 9h13v11h-13z"/><path d="M9.5 13h5"/></svg></span>
          Archived
        </button>
      </nav>
      <div class="sidebar-heading px-3 mt-4 mb-2">Tags</div>
      <nav id="tagList" class="nav nav-pills flex-column px-2 gap-1"></nav>
      <div class="sidebar-footer mt-auto d-flex">
        <button class="btn glass-button theme-toggle" id="themeButton" aria-label="Use light theme" title="Use light theme">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>
        </button>
      </div>
    </aside>

    <section class="note-browser">
      <header class="sticky-top browser-header">
        <div class="browser-title-row">
          <h1 class="browser-title">Library</h1>
          <button class="btn glass-button new-note-button" id="newNote" aria-label="New note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="d-flex gap-2 search-row">
          <button class="btn icon-button d-lg-none" id="openSidebar" aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="search-shell flex-grow-1">
            <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></span>
            <label class="visually-hidden" for="search">Search notes</label>
            <input class="form-control" id="search" type="search" placeholder="Search notes" autocomplete="off">
          </div>
        </div>
      </header>
      <div id="notesList" class="list-group list-group-flush" aria-live="polite"></div>
      <div id="emptyList" class="empty-state p-4 text-center text-secondary d-none">No notes here yet.</div>
    </section>

    <main class="editor-pane">
      <div id="emptyEditor" class="empty-editor text-secondary">
        <div class="empty-editor-card">
          <div class="empty-note-glyph" aria-hidden="true"><span></span></div>
          <h1 class="h4" id="emptyEditorTitle">A little space to think</h1>
          <p id="emptyEditorDescription">Capture an idea, make a list, or start a fresh page.</p>
          <button class="btn primary-button mt-3" id="emptyNewNote">Create a note</button>
        </div>
      </div>
      <div id="editor" class="editor d-none">
        <header class="editor-toolbar d-flex align-items-center gap-2">
          <button class="btn icon-button d-md-none" id="backToList" aria-label="Back to notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg></button>
          <span id="saveStatus" role="status" class="small text-secondary me-auto">Saved</span>
          <button class="btn quiet-button btn-sm" id="pinNote" aria-pressed="false">Pin</button>
          <div class="dropdown">
            <button class="btn icon-button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="More note actions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item" id="archiveNote">Archive</button></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item danger-button" id="deleteNote">Delete note</button></li>
            </ul>
          </div>
        </header>
        <div class="writing-area">
          <label class="visually-hidden" for="noteTitle">Note title</label>
          <input id="noteTitle" class="note-title" maxlength="200" placeholder="Untitled note">
          <div class="tags-section">
            <div class="tag-chips" id="tagChips"></div>
            <button class="btn quiet-button tag-edit-button" id="editTags" aria-expanded="false" aria-controls="tagEditor">Add tags</button>
            <div id="tagEditor" class="d-none">
              <label class="visually-hidden" for="noteTags">Tags, separated by commas</label>
              <input id="noteTags" class="form-control tag-input" placeholder="e.g. ideas, personal" aria-describedby="tagHelp">
              <span class="tag-help" id="tagHelp">Separate tags with commas.</span>
              <button class="btn quiet-button btn-sm" id="doneTags">Done</button>
            </div>
          </div>
          <label class="visually-hidden" for="noteContent">Note content</label>
          <textarea id="noteContent" class="note-content" placeholder="Start writing…"></textarea>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="messageToast" class="toast" role="status" aria-live="polite">
      <div class="toast-body" id="messageText"></div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
