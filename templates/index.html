<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StillNote</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="ambient-orb ambient-orb-one" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-two" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb-three" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top d-flex align-items-center justify-content-between">
        <a class="brand text-decoration-none" href="#">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img"><path d="M7 3.75h7.7L19 8.05v12.2H7z"/><path d="M14.5 3.75v4.5H19M10 12h6M10 15.25h6"/></svg>
          </span>
          <span>StillNote</span>
        </a>
        <button class="btn icon-button d-lg-none" id="closeSidebar" aria-label="Close navigation">×</button>
      </div>
      <nav class="nav nav-pills flex-column px-2 gap-1" aria-label="Notes navigation">
        <button class="nav-link active text-start" data-view="notes"><span class="nav-icon">▤</span>All notes</button>
        <button class="nav-link text-start" data-view="pinned"><span class="nav-icon">◆</span>Pinned</button>
        <button class="nav-link text-start" data-view="archived"><span class="nav-icon">⌁</span>Archived</button>
      </nav>
      <div class="sidebar-heading px-3 mt-4 mb-2">Tags</div>
      <nav id="tagList" class="nav nav-pills flex-column px-2 gap-1"></nav>
      <div class="sidebar-footer mt-auto d-flex">
        <button class="btn glass-button theme-toggle" id="themeButton" aria-label="Use light theme" title="Use light theme">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>
        </button>
      </div>
    </aside>

    <section class="note-browser">
      <header class="sticky-top browser-header">
        <div class="browser-title-row">
          <div>
            <div class="section-kicker">Library</div>
            <h1 class="browser-title">Notes</h1>
          </div>
          <button class="btn btn-primary new-note-button" id="newNote" aria-label="New note"><span aria-hidden="true">＋</span></button>
        </div>
        <div class="d-flex gap-2 search-row">
          <button class="btn icon-button d-lg-none" id="openSidebar" aria-label="Open navigation">☰</button>
          <div class="search-shell flex-grow-1">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="visually-hidden" for="search">Search notes</label>
            <input class="form-control" id="search" type="search" placeholder="Search notes" autocomplete="off">
          </div>
        </div>
      </header>
      <div id="notesList" class="list-group list-group-flush" aria-live="polite"></div>
      <div id="emptyList" class="empty-state p-4 text-center text-secondary d-none">No notes here yet.</div>
    </section>

    <main class="editor-pane">
      <div id="emptyEditor" class="empty-editor text-secondary">
        <div class="empty-editor-card">
          <div class="empty-note-glyph" aria-hidden="true"><span></span></div>
          <h1 class="h4">Choose a note</h1>
          <p>Or create a new one to start writing.</p>
        </div>
      </div>
      <div id="editor" class="editor d-none">
        <header class="editor-toolbar d-flex align-items-center gap-2">
          <button class="btn icon-button d-md-none" id="backToList" aria-label="Back to notes">←</button>
          <span id="saveStatus" class="small text-secondary me-auto">Saved</span>
          <button class="btn glass-button btn-sm" id="pinNote">Pin</button>
          <button class="btn glass-button btn-sm" id="archiveNote">Archive</button>
          <button class="btn glass-button danger-button btn-sm" id="deleteNote">Delete</button>
        </header>
        <div class="writing-area">
          <label class="visually-hidden" for="noteTitle">Note title</label>
          <input id="noteTitle" class="note-title" maxlength="200" placeholder="Untitled note">
          <label class="visually-hidden" for="noteTags">Tags</label>
          <input id="noteTags" class="form-control form-control-sm border-0 px-0 tag-input" placeholder="Tags, separated by commas">
          <label class="visually-hidden" for="noteContent">Note content</label>
          <textarea id="noteContent" class="note-content" placeholder="Start writing…"></textarea>
        </div>
      </div>
    </main>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="messageToast" class="toast" role="status" aria-live="polite">
      <div class="toast-body" id="messageText"></div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
